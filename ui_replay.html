<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Governance Temporal Replay</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:system-ui;margin:20px}
.container{max-width:1000px;margin:auto}
</style>
</head>
<body>
<div class="container">
<h1>Temporal Replay Timeline</h1>
<label>Node ID: <input id="nodeId" value="node-1"/></label>
<button onclick="loadHistory()">Load</button>
<canvas id="chart"></canvas>
</div>
<script>
let chart;
async function loadHistory(){
  const id = document.getElementById('nodeId').value;
  const res = await fetch(`/api/governance/history/${id}`);
  const data = await res.json();
  const h = data.history;
  const labels = h.map(r=>r.timestamp);
  const risk = h.map(r=>r.risk);
  const evidence = h.map(r=>r.evidence);
  const compliance = h.map(r=>r.compliance);
  if(chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'),{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'Risk',data:risk,borderColor:'red'},
        {label:'Evidence',data:evidence,borderColor:'green'},
        {label:'Compliance',data:compliance,borderColor:'blue'}
      ]
    },
    options:{responsive:true,scales:{x:{ticks:{maxRotation:90}}}}
  });
}
</script>
</body>
</html>
